<script>
/* ============================================================
   DATA GLOBAL
============================================================ */

let masterStockData = [];
let warehouses = [];
let categories = [];
let transactionLogs = [];
let stateDeductions = {};

const EXCLUDED_COLUMNS = [
    "NOTE", "NOTES", "CATATAN", "TOTAL", "JUMLAH", "GRAND TOTAL", "PRDCT"
];


/* ============================================================
   UTILITAS
============================================================ */

function normalizeText(value) {
    return String(value ?? "").trim().replace(/\s+/g, " ").toUpperCase();
}

function normalizeHeader(value) {
    return normalizeText(value).replace(/[_\-./]+/g, " ").trim();
}

function parseExcelNumber(value) {
    if (value === null || value === undefined || value === "") return 0;
    if (typeof value === "number") return Number.isFinite(value) ? value : 0;
    let str = String(value).trim();
    if (!str) return 0;
    str = str.replace(/\s/g, "");
    if (/^\(.*\)$/.test(str)) str = "-" + str.slice(1, -1);
    if (str.includes(".") && str.includes(",")) {
        if (str.lastIndexOf(",") > str.lastIndexOf(".")) {
            str = str.replace(/\./g, "").replace(",", ".");
        } else {
            str = str.replace(/,/g, "");
        }
    } else if (/^-?\d{1,3}(\.\d{3})+$/.test(str)) {
        str = str.replace(/\./g, "");
    } else if (/^-?\d{1,3}(,\d{3})+$/.test(str)) {
        str = str.replace(/,/g, "");
    } else {
        str = str.replace(/,/g, ".");
    }
    const result = parseFloat(str);
    return Number.isFinite(result) ? result : 0;
}

function showUploadStatus(message, type = "success") {
    const box = document.getElementById("uploadStatus");
    box.classList.remove(
        "hidden",
        "bg-emerald-50", "text-emerald-700", "border-emerald-200",
        "bg-red-50", "text-red-700", "border-red-200",
        "bg-amber-50", "text-amber-700", "border-amber-200"
    );

    if (type === "error") {
        box.classList.add("bg-red-50", "text-red-700", "border-red-200");
    } else if (type === "warning") {
        box.classList.add("bg-amber-50", "text-amber-700", "border-amber-200");
    } else {
        box.classList.add("bg-emerald-50", "text-emerald-700", "border-emerald-200");
    }

    box.innerHTML = message;
    box.classList.remove("hidden");
}


/* ============================================================
   TAB
============================================================ */

function switchTab(tab) {
    const stok = document.getElementById("section-stok");
    const penarikan = document.getElementById("section-penarikan");

    const tabStok = document.getElementById("tab-stok");
    const tabPenarikan = document.getElementById("tab-penarikan");

    if (tab === "stok") {
        stok.classList.remove("hidden");
        penarikan.classList.add("hidden");
        tabStok.className = "py-3 px-4 font-semibold text-blue-600 border-b-2 border-blue-600";
        tabPenarikan.className = "py-3 px-4 font-semibold text-slate-500";
    } else {
        stok.classList.add("hidden");
        penarikan.classList.remove("hidden");
        tabPenarikan.className = "py-3 px-4 font-semibold text-blue-600 border-b-2 border-blue-600";
        tabStok.className = "py-3 px-4 font-semibold text-slate-500";

        initPenarikanCheckboxes();
        loadFormPenarikan();
    }
}


/* ============================================================
   DATA CONTOH
============================================================ */

function loadDefaultData() {
    loadSampleData();
    showUploadStatus("Data contoh berhasil dimuat.", "success");
}

function loadSampleData() {
    masterStockData = [
        {
            category: "COUGAR",
            desc: "SIDE PANEL ACRYLIC FOR QBX 2MM",
            qtys: { SUNTR: 12, CURUG: 0, SBY: 5, M2M: 0, SEMARANG: 2 }
        },
        {
            category: "FIBER Kabel",
            desc: "Kabel Patchcord 3 METER SC-SC/UPC G657A2",
            qtys: { SUNTR: 9, CURUG: 2, SBY: 45, M2M: 2, SEMARANG: 0 }
        }
    ];

    warehouses = [
        "SUNTR", "M2M", "CURUG", "CIPUTAT", "SBY", "SBY-ITC",
        "LBK", "BALI", "BALI 2", "BDG", "SERANG", "KONSI",
        "MALANG", "RMA", "SEMARANG", "PRDCT"
    ];

    categories = [...new Set(masterStockData.map(item => item.category))];

    stateDeductions = {};
    transactionLogs = [];

    initDropdowns();
    renderStokTable();
    renderRekap();
}


/* ============================================================
   DROPDOWN
============================================================ */

function initDropdowns() {
    const gudangSelect = document.getElementById("filterGudang");
    const katSelect = document.getElementById("filterKategori");

    gudangSelect.innerHTML = '<option value="">Semua Gudang</option>';
    warehouses.forEach(w => {
        gudangSelect.innerHTML += `<option value="${escapeHtml(w)}">${escapeHtml(w)}</option>`;
    });

    katSelect.innerHTML = '<option value="">Semua Kategori</option>';
    categories.forEach(k => {
        katSelect.innerHTML += `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`;
    });

    document.getElementById("totalItemCount").innerText = masterStockData.length;
}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ============================================================
   STOK
============================================================ */

function getStatusInfo(qty) {
    if (qty === 0) return { text: "Kosong (0)", class: "bg-red-100 text-red-700" };
    if (qty >= 1 && qty <= 5) return { text: "Menipis (" + qty + ")", class: "bg-amber-100 text-amber-700" };
    return { text: "Aman (" + qty + ")", class: "bg-emerald-100 text-emerald-700" };
}

function getEffectiveQty(itemIdx, warehouse) {
    const base = Number(masterStockData[itemIdx]?.qtys?.[warehouse] || 0);
    const deduction = Number(stateDeductions[itemIdx]?.[warehouse] || 0);
    return Math.max(0, base + deduction);
}

function renderStokTable() {
    const tbody = document.getElementById("stokTableBody");
    const countStatus = document.getElementById("stokCountStatus");
    tbody.innerHTML = "";

    const searchSku = document.getElementById("filterSku").value.toLowerCase().trim();
    const filterKat = document.getElementById("filterKategori").value;
    const filterGudang = document.getElementById("filterGudang").value;
    const filterStatus = document.getElementById("filterStatus").value;

    let rows = [];
    masterStockData.forEach((item, itemIdx) => {
        warehouses.forEach(wh => {
            rows.push({
                category: item.category,
                desc: item.desc,
                gudang: wh,
                qty: getEffectiveQty(itemIdx, wh)
            });
        });
    });

    const filtered = rows.filter(r => {
        const matchSku = r.desc.toLowerCase().includes(searchSku);
        const matchKat = filterKat === "" || r.category === filterKat;
        const matchGudang = filterGudang === "" || r.gudang === filterGudang;

        let matchStatus = true;
        if (filterStatus === "0") matchStatus = r.qty === 0;
        else if (filterStatus === "menipis") matchStatus = r.qty >= 1 && r.qty <= 5;
        else if (filterStatus === "aman") matchStatus = r.qty > 5;

        return matchSku && matchKat && matchGudang && matchStatus;
    });

    countStatus.innerText = `Menampilkan ${filtered.length} baris data dari ${rows.length} baris.`;

    if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Tidak ada data yang sesuai filter.</td></tr>`;
        return;
    }

    filtered.slice(0, 1000).forEach(r => {
        const status = getStatusInfo(r.qty);
        tbody.innerHTML += `
            <tr class="hover:bg-slate-50">
                <td class="p-3 font-medium text-slate-700">${escapeHtml(r.desc)}</td>
                <td class="p-3 text-slate-600 text-xs font-semibold">${escapeHtml(r.category || "-")}</td>
                <td class="p-3 text-slate-600">${escapeHtml(r.gudang)}</td>
                <td class="p-3 text-center font-bold">${r.qty}</td>
                <td class="p-3 text-center">
                    <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${status.class}">${status.text}</span>
                </td>
            </tr>
        `;
    });
}


/* ============================================================
   PENARIKAN CHECKBOX
============================================================ */

function initPenarikanCheckboxes() {
    const containerAsal = document.getElementById("containerAsal");
    const containerTujuan = document.getElementById("containerTujuan");

    const checkedAsalOld = Array.from(document.querySelectorAll(".chk-asal:checked")).map(cb => cb.value);
    const checkedTujuanOld = Array.from(document.querySelectorAll(".chk-tujuan:checked")).map(cb => cb.value);

    containerAsal.innerHTML = "";
    containerTujuan.innerHTML = "";

    warehouses.forEach((w, idx) => {
        const asalChecked = checkedAsalOld.length > 0 ? checkedAsalOld.includes(w) : idx === 0;
        const tujuanChecked = checkedTujuanOld.length > 0 ? checkedTujuanOld.includes(w) : idx === 1;

        containerAsal.innerHTML += `
            <label class="flex items-center gap-1.5 text-xs font-medium cursor-pointer bg-white px-2.5 py-1 rounded border shadow-sm">
                <input type="checkbox" value="${escapeHtml(w)}" class="chk-asal rounded text-blue-600" ${asalChecked ? "checked" : ""}>
                <span>${escapeHtml(w)}</span>
            </label>
        `;

        containerTujuan.innerHTML += `
            <label class="flex items-center gap-1.5 text-xs font-medium cursor-pointer bg-white px-2.5 py-1 rounded border shadow-sm">
                <input type="checkbox" value="${escapeHtml(w)}" class="chk-tujuan rounded text-emerald-600" ${tujuanChecked ? "checked" : ""}>
                <span>${escapeHtml(w)}</span>
            </label>
        `;
    });
}


/* ============================================================
   FORM PENARIKAN (DENGAN AUTO-SYNC JUMLAH DISETUJUI)
============================================================ */

function loadFormPenarikan() {
    const selectedAsal = Array.from(document.querySelectorAll(".chk-asal:checked")).map(cb => cb.value);
    const selectedTujuan = Array.from(document.querySelectorAll(".chk-tujuan:checked")).map(cb => cb.value);
    const filterStokTujuan = document.getElementById("filterStokPenarikan").value;
    const activeCategory = document.getElementById("filterKategori").value;
    const tbody = document.getElementById("excelTableBody");
    const infoStatus = document.getElementById("excelInfoStatus");

    if (selectedAsal.length === 0 || selectedTujuan.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-slate-400">Silakan centang minimal 1 Gudang Asal dan 1 Gudang Tujuan.</td></tr>`;
        return;
    }

    infoStatus.innerText = `Kategori: ${activeCategory || "Semua"} | Asal: [${selectedAsal.join(", ")}] ➔ Tujuan: [${selectedTujuan.join(", ")}]`;
    tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-blue-600 font-semibold">Memuat data barang...</td></tr>`;

    setTimeout(() => {
        tbody.innerHTML = "";
        let rowCount = 0;

        masterStockData.forEach((item, index) => {
            if (activeCategory && item.category !== activeCategory) return;

            let totalStokAsal = 0;
            selectedAsal.forEach(asalW => {
                totalStokAsal += getEffectiveQty(index, asalW);
            });

            let totalStokTujuan = 0;
            selectedTujuan.forEach(tujuanW => {
                totalStokTujuan += getEffectiveQty(index, tujuanW);
            });

            if (totalStokAsal === 0 && totalStokTujuan === 0) return;

            let matchFilter = true;
            if (filterStokTujuan === "lt10" && totalStokTujuan >= 10) matchFilter = false;
            if (filterStokTujuan === "lt50" && totalStokTujuan >= 50) matchFilter = false;
            if (filterStokTujuan === "gt50" && totalStokTujuan <= 50) matchFilter = false;

            if (!matchFilter) return;
            rowCount++;

            tbody.innerHTML += `
                <tr class="hover:bg-slate-50 excel-row" data-item-idx="${index}">
                    <td class="p-2 border-r text-center font-medium">${rowCount}</td>
                    <td class="p-2 border-r font-bold text-slate-800">
                        ${escapeHtml(item.desc)}
                        <div class="text-[10px] text-slate-500 font-normal">Kategori: ${escapeHtml(item.category)}</div>
                    </td>
                    <td class="p-2 border-r text-center font-bold text-blue-700 bg-blue-50 stok-asal-cell" data-base="${totalStokAsal}">
                        ${totalStokAsal}
                    </td>
                    <td class="p-2 border-r text-center">
                        <input type="number" min="0" value="0" class="input-diajukan border rounded px-1.5 py-1 text-xs w-20 text-center font-bold" oninput="syncAndCalculate(this, ${totalStokAsal}, ${totalStokTujuan})">
                    </td>
                    <td class="p-2 border-r text-center">
                        <input type="number" min="0" value="0" class="input-disetujui border rounded px-1.5 py-1 text-xs w-20 text-center font-bold" oninput="hitungKalkulasiExcel(this, ${totalStokAsal}, ${totalStokTujuan})">
                    </td>
                    <td class="p-2 border-r text-center font-bold text-emerald-700 bg-emerald-50 stok-tujuan-cell">
                        ${totalStokTujuan}
                    </td>
                    <td class="p-2 border-r">
                        <input type="text" placeholder="Keterangan..." class="input-ket border rounded px-2 py-1 text-xs w-full">
                    </td>
                    <td class="p-2 border-r text-center font-bold text-red-600 sisa-asal-res">
                        ${totalStokAsal}
                    </td>
                    <td class="p-2 text-center font-bold text-indigo-600 sisa-tujuan-res">
                        ${totalStokTujuan}
                    </td>
                </tr>
            `;

            if (rowCount >= 500) return;
        });

        if (rowCount === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-slate-400">Tidak ada barang yang sesuai kategori & filter stok tujuan tersebut.</td></tr>`;
        }
    }, 20);
}


/* ============================================================
   KALKULASI & AUTO-SYNC DIAJUKAN KE DISETUJUI
============================================================ */

function syncAndCalculate(inputElem, stokAsalMax, stokTujuanAwal) {
    const row = inputElem.closest("tr");
    const diajukanInput = row.querySelector(".input-diajukan");
    const disetujuiInput = row.querySelector(".input-disetujui");

    let diajukan = Math.max(0, parseInt(diajukanInput.value) || 0);

    if (diajukan > stokAsalMax) {
        diajukan = stokAsalMax;
        diajukanInput.value = diajukan;
    }

    // Jika Jumlah Disetujui masih 0 atau kosong, otomatis sinkronkan dengan Jumlah Diajukan agar langsung terhitung
    if (parseInt(disetujuiInput.value) === 0 || disetujuiInput.value === "") {
        disetujuiInput.value = diajukan;
    }

    hitungKalkulasiExcel(disetujuiInput, stokAsalMax, stokTujuanAwal);
}

function hitungKalkulasiExcel(inputElem, stokAsalMax, stokTujuanAwal) {
    const row = inputElem.closest("tr");
    const diajukanInput = row.querySelector(".input-diajukan");
    const disetujuiInput = row.querySelector(".input-disetujui");
    const sisaAsalRes = row.querySelector(".sisa-asal-res");
    const sisaTujuanRes = row.querySelector(".sisa-tujuan-res");

    let diajukan = Math.max(0, parseInt(diajukanInput.value) || 0);
    let disetujui = Math.max(0, parseInt(disetujuiInput.value) || 0);

    if (diajukan > stokAsalMax) {
        diajukan = stokAsalMax;
        diajukanInput.value = diajukan;
    }

    if (disetujui > diajukan) {
        disetujui = diajukan;
        disetujuiInput.value = disetujui;
    }

    const sisaAsal = stokAsalMax - disetujui;
    const sisaTujuan = stokTujuanAwal + disetujui;

    sisaAsalRes.innerText = sisaAsal;
    sisaTujuanRes.innerText = sisaTujuan;
}


/* ============================================================
   SIMPAN PENARIKAN & UPDATE STOK PERMANEN
============================================================ */

function simpanFormPenarikan(jenisPenarikan) {
    const selectedAsal = Array.from(document.querySelectorAll(".chk-asal:checked")).map(cb => cb.value);
    const selectedTujuan = Array.from(document.querySelectorAll(".chk-tujuan:checked")).map(cb => cb.value);

    if (selectedAsal.length === 0 || selectedTujuan.length === 0) {
        alert("Pilih minimal 1 Gudang Asal dan 1 Gudang Tujuan terlebih dahulu!");
        return;
    }

    const rows = document.querySelectorAll(".excel-row");
    let count = 0;
    const excelExportData = [];

    excelExportData.push(["PT. GLORI MITRA SUKSES - PENGAJUAN PENARIKAN BARANG"]);
    excelExportData.push([`Jenis: ${jenisPenarikan}`]);
    excelExportData.push([`Asal: ${selectedAsal.join(", ")}`, "", `Tujuan: ${selectedTujuan.join(", ")}`]);
    excelExportData.push([]);
    excelExportData.push([
        "No", "Deskripsi Barang", "Total Stok Asal",
        "Jumlah Diajukan", "Jumlah Disetujui", "Total Stok Tujuan",
        "Keterangan", "Sisa Stok Asal", "Sisa Stok Tujuan"
    ]);

    rows.forEach(row => {
        const itemIdx = Number(row.getAttribute("data-item-idx"));
        const diajukan = Math.max(0, parseInt(row.querySelector(".input-diajukan").value) || 0);
        const disetujui = Math.max(0, parseInt(row.querySelector(".input-disetujui").value) || 0);
        const ket = row.querySelector(".input-ket").value;

        if (diajukan === 0 && disetujui === 0) return;

        const item = masterStockData[itemIdx];

        // 1. Kurangi stok asal secara permanen
        let sisaToDeduct = disetujui;
        selectedAsal.forEach(asalW => {
            if (sisaToDeduct <= 0) return;
            const base = Number(item.qtys[asalW] || 0);
            const ded = Number(stateDeductions[itemIdx]?.[asalW] || 0);
            const avail = Math.max(0, base + ded);

            if (avail > 0) {
                const take = Math.min(sisaToDeduct, avail);
                stateDeductions[itemIdx] = stateDeductions[itemIdx] || {};
                stateDeductions[itemIdx][asalW] = ded - take;
                sisaToDeduct -= take;
            }
        });

        // 2. Tambah stok tujuan secara permanen
        let sisaToAdd = disetujui;
        selectedTujuan.forEach((tujuanW, tIdx) => {
            if (sisaToAdd <= 0) return;
            const remainingWarehouses = selectedTujuan.length - tIdx;
            const addShare = Math.ceil(sisaToAdd / remainingWarehouses);

            stateDeductions[itemIdx] = stateDeductions[itemIdx] || {};
            const curAdd = Number(stateDeductions[itemIdx][tujuanW] || 0);
            stateDeductions[itemIdx][tujuanW] = curAdd + addShare;

            sisaToAdd -= addShare;
        });

        transactionLogs.push({
            type: jenisPenarikan,
            asal: selectedAsal.join(", "),
            tujuan: selectedTujuan.join(", "),
            desc: item.desc,
            diajukan,
            disetujui
        });

        excelExportData.push([
            count + 1,
            item.desc,
            row.querySelector(".stok-asal-cell").innerText,
            diajukan,
            disetujui,
            row.querySelector(".stok-tujuan-cell").innerText,
            ket,
            row.querySelector(".sisa-asal-res").innerText,
            row.querySelector(".sisa-tujuan-res").innerText
        ]);

        count++;
    });

    if (count === 0) {
        alert("Tidak ada barang yang diisi jumlah pengajuannya.");
        return;
    }

    renderRekap();
    renderStokTable();

    if (typeof XLSX === "undefined") {
        alert("Library Excel tidak berhasil dimuat.");
        return;
    }

    const worksheet = XLSX.utils.aoa_to_sheet(excelExportData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Pengajuan Penarikan");

    const tanggal = new Date().toISOString().slice(0, 10);
    const fileName = `Pengajuan_${jenisPenarikan.replace(/\s+/g, "_")}_${tanggal}.xlsx`;

    XLSX.writeFile(workbook, fileName);

    alert(`${jenisPenarikan} berhasil disimpan! Stok di gudang tujuan telah bertambah permanen, dan file laporan Excel berhasil di-download.`);
    loadFormPenarikan();
}


/* ============================================================
   REKAP
============================================================ */

function renderRekap() {
    const tbody = document.getElementById("rekapTableBody");
    tbody.innerHTML = "";

    if (transactionLogs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">Belum ada riwayat penarikan tersimpan.</td></tr>`;
        return;
    }

    transactionLogs.forEach((log, index) => {
        tbody.innerHTML += `
            <tr class="hover:bg-slate-50">
                <td class="p-2 border-b">${index + 1}</td>
                <td class="p-2 border-b">
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold ${log.type === "Penarikan 1" ? "bg-emerald-100 text-emerald-800" : "bg-indigo-100 text-indigo-800"}">
                        ${escapeHtml(log.type)}
                    </span>
                </td>
                <td class="p-2 border-b font-semibold">${escapeHtml(log.asal)}</td>
                <td class="p-2 border-b font-semibold text-blue-900">${escapeHtml(log.tujuan)}</td>
                <td class="p-2 border-b">${escapeHtml(log.desc)}</td>
                <td class="p-2 border-b text-center font-bold">${log.diajukan}</td>
                <td class="p-2 border-b text-center font-bold">${log.disetujui}</td>
            </tr>
        `;
    });
}


/* ============================================================
   EXCEL IMPORT (FUNGSI UPLOAD ANDA YANG SUDAH BERHASIL)
============================================================ */

document.getElementById("excelUpload").addEventListener("change", function(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    importExcelFile(file);
    e.target.value = "";
});

function importExcelFile(file) {
    if (typeof XLSX === "undefined") {
        showUploadStatus("❌ Library Excel belum dimuat.", "error");
        return;
    }

    showUploadStatus(`⏳ Sedang membaca file <b>${escapeHtml(file.name)}</b>...`, "warning");

    const reader = new FileReader();
    reader.onerror = function() {
        showUploadStatus("❌ Browser gagal membaca file.", "error");
    };

    reader.onload = function(e) {
        try {
            const arrayBuffer = e.target.result;
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, { type: "array" });

            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "", raw: false });

            if (!jsonRows || jsonRows.length === 0) {
                throw new Error("Sheet Excel kosong.");
            }

            const headerInfo = findExcelHeader(jsonRows);
            if (!headerInfo) {
                throw new Error("Baris header tidak ditemukan.");
            }

            const headerRowIdx = headerInfo.rowIndex;
            const headers = headerInfo.headers;
            const descColIdx = headerInfo.descColIdx;
            const katColIdx = headerInfo.katColIdx;

            const detected = detectWarehouseColumns(headers, descColIdx, katColIdx);
            let detectedWarehouses = detected.warehouses;
            let whIndices = detected.indices;

            if (detectedWarehouses.length === 0) {
                for (let idx = 0; idx < headers.length; idx++) {
                    if (idx === descColIdx || idx === katColIdx) continue;
                    const name = normalizeHeader(headers[idx]);
                    if (name && !EXCLUDED_COLUMNS.includes(name)) {
                        detectedWarehouses.push(String(headers[idx]).trim());
                        whIndices[String(headers[idx]).trim()] = idx;
                    }
                }
            }

            if (detectedWarehouses.length === 0) {
                throw new Error("Kolom gudang tidak berhasil ditemukan.");
            }

            const parsedData = [];
            let currentCategory = "UMUM";

            for (let i = headerRowIdx + 1; i < jsonRows.length; i++) {
                const row = jsonRows[i] || [];
                const descValue = row[descColIdx];
                const desc = String(descValue ?? "").trim();
                if (!desc) continue;

                const descNorm = normalizeText(desc);
                if (descNorm === "TOTAL" || descNorm.includes("GRAND TOTAL") || descNorm.includes("CETAK DI")) {
                    continue;
                }

                if (katColIdx !== -1) {
                    const katValue = String(row[katColIdx] ?? "").trim();
                    const katNorm = normalizeText(katValue);
                    if (katValue && katNorm !== "0" && katNorm !== "KATAGORI" && katNorm !== "KATEGORI") {
                        currentCategory = katValue;
                    }
                }

                const qtys = {};
                detectedWarehouses.forEach(warehouse => {
                    const colIdx = whIndices[warehouse];
                    const rawValue = colIdx !== undefined ? row[colIdx] : 0;
                    qtys[warehouse] = parseExcelNumber(rawValue);
                });

                parsedData.push({
                    category: currentCategory,
                    desc: desc,
                    qtys: qtys
                });
            }

            if (parsedData.length === 0) {
                throw new Error("Tidak ada data barang setelah header.");
            }

            masterStockData = parsedData;
            warehouses = detectedWarehouses;
            categories = [...new Set(masterStockData.map(item => item.category))];
            stateDeductions = {};
            transactionLogs = [];

            initDropdowns();
            renderStokTable();
            renderRekap();
            initPenarikanCheckboxes();

            showUploadStatus(`✅ <b>${escapeHtml(file.name)}</b> berhasil dimuat (${masterStockData.length} item).`, "success");

        } catch (err) {
            console.error("ERROR IMPORT EXCEL:", err);
            showUploadStatus(`❌ Gagal membaca Excel: ${escapeHtml(err.message)}`, "error");
        }
    };

    reader.readAsArrayBuffer(file);
}


/* ============================================================
   CARI HEADER EXCEL OTOMATIS
============================================================ */

function findExcelHeader(rows) {
    const maxRows = Math.min(rows.length, 50);
    let best = null;

    for (let r = 0; r < maxRows; r++) {
        const row = rows[r] || [];
        if (!row.length) continue;

        let descColIdx = -1;
        let katColIdx = -1;

        row.forEach((cell, idx) => {
            const h = normalizeHeader(cell);
            if (h === "KATEGORI" || h === "KATAGORI" || h.includes("KATEGORI")) {
                if (katColIdx === -1) katColIdx = idx;
            }
            if (["DESKRIPSI", "DESKRIPSI BARANG", "NAMA BARANG", "BARANG", "ITEM", "PRODUCT", "PRODUK", "DESCRIPTION"].includes(h)) {
                if (descColIdx === -1) descColIdx = idx;
            }
        });

        if (descColIdx === -1) {
            row.forEach((cell, idx) => {
                const h = normalizeHeader(cell);
                if (h.includes("DESKRIPSI") || h.includes("DESCRIPTION") || h.includes("NAMA BARANG")) {
                    if (descColIdx === -1) descColIdx = idx;
                }
            });
        }

        if (descColIdx === -1 && katColIdx !== -1 && row.length >= 3) {
            descColIdx = 0;
        }

        let nonEmptyCount = row.filter(x => String(x ?? "").trim() !== "").length;

        if ((descColIdx !== -1 || katColIdx !== -1) && nonEmptyCount >= 2) {
            best = {
                rowIndex: r,
                headers: row,
                descColIdx: descColIdx !== -1 ? descColIdx : 0,
                katColIdx: katColIdx
            };
            break;
        }
    }

    if (!best && rows.length > 0) {
        const first = rows[0] || [];
        if (first.length >= 2) {
            best = { rowIndex: 0, headers: first, descColIdx: 0, katColIdx: -1 };
        }
    }

    return best;
}


/* ============================================================
   DETEKSI KOLOM GUDANG
============================================================ */

function detectWarehouseColumns(headers, descColIdx, katColIdx) {
    const warehousesFound = [];
    const indices = {};

    headers.forEach((header, idx) => {
        if (idx === descColIdx || idx === katColIdx) return;
        const original = String(header ?? "").trim();
        if (!original) return;

        const normalized = normalizeHeader(original);
        if (!normalized || normalized === "UNDEFINED" || EXCLUDED_COLUMNS.includes(normalized)) return;

        const ignoredPatterns = ["HARGA", "PRICE", "SATUAN", "UNIT", "KODE", "SKU", "BARCODE", "NOTE", "CATATAN", "TOTAL", "JUMLAH"];
        if (ignoredPatterns.some(p => normalized === p || normalized.includes(p))) return;

        warehousesFound.push(original);
        indices[original] = idx;
    });

    return { warehouses: warehousesFound, indices: indices };
}
